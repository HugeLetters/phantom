[package]
name = "service"
version.workspace = true
edition.workspace = true

[[bin]]
name = "phantom-service"
path = "src/main.rs"

[dependencies]
proto.workspace = true
lifecycle.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
librqbit = { version = "9.1", default-features = false, features = ["default-tls"] }
# The version and TLS librqbit builds: fetches a .torrent URL without the engine.
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# statfs, for free space (`engine/space.rs`); already built for librqbit and tokio.
libc = "0.2"
# What Finder says of a volume: its name and its free space with purgeable space counted. The
# version and the objc2 the GUI already uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue"] }
notify = "8"
notify-debouncer-full = "0.6"
# Delete moves files to the Trash (NSFileManager); already in the tree through the GUI.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "FoundationErrors", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
lifecycle = { workspace = true, features = ["harness"] }
proptest = "1.12"
proptest-state-machine = "0.9"
client.workspace = true
