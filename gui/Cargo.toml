[package]
name = "gui"
version.workspace = true
edition.workspace = true

[[bin]]
# Not "Phantom": macOS filesystems are case-insensitive, so it would collide with the `phantom` CLI.
name = "phantom-gui"
path = "src/main.rs"

[dependencies]
proto.workspace = true
anyhow.workspace = true
# Rune is pre-release: pin a `dev` rev and bump it deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "ddf14140253bd1b963993895e3fa025d1ec58537", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "ddf14140253bd1b963993895e3fa025d1ec58537" }
