[package]
name = "gui"
version.workspace = true
edition.workspace = true

[[bin]]
# Not "Phantom": macOS filesystems are case-insensitive, so it would collide with the `phantom` CLI.
name = "phantom-gui"
path = "src/main.rs"

# AppKit expects the main thread, which the test harness doesn't give: these run in their own `main`.
[[test]]
name = "appkit"
harness = false

[dependencies]
proto.workspace = true
lifecycle.workspace = true
machine.workspace = true
client.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Rune is pre-release: pin a `dev` rev and bump it deliberately, with the root Cargo.toml's patches.
# `keys-overlay` (and `tooling` with it) keeps the headless flags in release builds: without them a
# release `--snap` would open the real app, on the user's own data.
rune = { git = "https://github.com/anomalyco/rune", rev = "5986ab76a09be9199b01d24bda6d0464415a0462", features = ["native-file-dialog", "keys-overlay"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "5986ab76a09be9199b01d24bda6d0464415a0462" }

# The open-documents Apple event (gui/src/platform/open_documents.rs), until it moves to Rune's hook (#381), and
# the App icon (gui/src/platform/app_icon/appkit.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSArray", "NSAppleEventManager", "NSData", "NSKeyValueObserving", "NSNotification", "NSString", "NSURL"] }
# AppKit for the App icon, the menu bar's standard items and the Settings window's frame, typed; the version
# Rune already builds (through rfd).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSScreen", "NSView", "NSWindow", "NSWorkspace"] }

[dev-dependencies]
lifecycle = { workspace = true, features = ["harness"] }
machine = { workspace = true, features = ["harness"] }
cases.workspace = true
proptest = "1.12"
proptest-state-machine = "0.9"
tempfile = "3"
