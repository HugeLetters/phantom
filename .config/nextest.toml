# Run with: cargo nextest run --workspace
# gui's `appkit` test has its own harness, which nextest can't list: `default-filter` leaves it out,
# for `cargo test -p gui --test appkit`. nextest doesn't run doc-tests: `cargo test --doc` does.
#
# The budget: a test is flagged SLOW past 20 s on an idle machine. `--profile budget` fails it there,
# unless the budget profile lists it below, with why. The default profile only kills one at 300 s:
# agents' runs share a loaded machine, where a 20 s test can take minutes.
experimental = ["wrapper-scripts"]

[profile.default]
default-filter = 'not binary(appkit)'
retries = 1
# Most tests wait more than they compute (every engine's stop alone waits librqbit's 1 s): more
# run at once than there are cores. The GUI's compute, so `cpu` holds them to the cores.
test-threads = 24
slow-timeout = { period = "20s", terminate-after = 15 }
status-level = "slow"
final-status-level = "slow"

# Every test binary runs from its own folder, `target/<profile>/run/<binary>/` (`scripts/own-folder.sh`):
# the executable's directory is read at process start, and `deps/` holds tens of thousands of files.
[scripts.wrapper.own-folder]
# nextest runs a wrapper from the package's folder, so the script is found from the workspace root.
command = ['/bin/bash', '-c', 'exec "$NEXTEST_WORKSPACE_ROOT/scripts/own-folder.sh" "$@"', 'own-folder']

[[profile.default.scripts]]
filter = 'all()'
run-wrapper = 'own-folder'

[test-groups]
cpu = { max-threads = "num-cpus" }

[[profile.default.overrides]]
filter = 'package(gui)'
test-group = 'cpu'

# The longest tests start first, so none begins last and sets the run's tail: the engine and service
# tests that took over 5 s (split by case where they could be), then the GUI's longest.
[[profile.default.overrides]]
filter = 'binary(settings) | test(/engine::tests::(oracle|crashed|renaming|undo_place|the_free_space_shown)/) | test(/engine::race_tests::a_move_held_mid_copy/) | test(/engine::tests::letgo/) | test(/engine::tests::links/)'
priority = 50

[[profile.default.overrides]]
filter = 'package(gui) & test(/tests::(settings|undo|moving|window|generated)/)'
priority = 20

[profile.budget]
slow-timeout = { period = "20s", terminate-after = 1 }
retries = 0

# The long property runs (`PROPTEST_CASES=256` and up): a test is flagged every 60 s and never
# killed. A test killed in another profile counts as failed (TIMEOUT), never as passed.
[profile.long]
slow-timeout = { period = "60s" }
retries = 0
