# Run with: cargo nextest run --workspace -E 'not binary(appkit)'
# (gui's `appkit` test has its own harness, which nextest can't list; run it with
# `cargo test -p gui --test appkit`.) nextest doesn't run doc-tests: `cargo test --doc` does.
[profile.default]
retries = 1
slow-timeout = { period = "60s", terminate-after = 5 }
status-level = "slow"
final-status-level = "slow"
