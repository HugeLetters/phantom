<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
	:root {
		color-scheme: light dark;
		--bg: #f6f7f9; --card: #fff; --text: #1d2125; --muted: #6b7280; --line: #e3e6ea; --hover: #f0f2f4;
		--accent: #d33f49; --accent-text: #fff; --open: #b45309; --answered: #2563eb; --resolved: #059669;
		--code: #f1f3f5;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #121416; --card: #1b1e21; --text: #e6e8ea; --muted: #8b939c; --line: #2c3136; --hover: #23272b;
			--accent: #ef5a63; --open: #f59e0b; --answered: #60a5fa; --resolved: #34d399;
			--code: #24282c;
		}
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
	a { color: inherit; }
	header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
	.bar { max-width: 980px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
	h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
	h1 a { text-decoration: none; }
	.root { color: var(--muted); font-size: 13px; }
	.spacer { flex: 1; }
	button.primary, button.secondary { font: inherit; border-radius: 6px; padding: 5px 12px; cursor: pointer; border: 1px solid var(--line); }
	button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
	button:disabled { opacity: .45; cursor: default; }
	button.secondary { background: var(--card); color: var(--text); }
	button.link { background: none; border: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
	button.link:hover { color: var(--text); text-decoration: underline; }
	select { font: inherit; font-size: 13px; width: 200px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
	main { max-width: 980px; margin: 0 auto; padding: 16px 20px 80px; }
	.empty { color: var(--muted); text-align: center; padding: 60px 0; }

	/* List */
	.list { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
	.item { display: flex; gap: 10px; align-items: baseline; padding: 10px 16px; border-top: 1px solid var(--line); text-decoration: none; }
	.item:first-child { border-top: none; }
	.item:hover { background: var(--hover); }
	.item .title { flex: 1; font-weight: 500; }
	.item.turn .title { font-weight: 650; }
	.item.turn { box-shadow: 3px 0 0 var(--accent) inset; }
	.section { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 4px 6px; }
	.section:first-child { padding-top: 0; }

	/* Entry */
	.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
	.card.turn { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
	.nav { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 14px; }
	.nav .position { color: var(--muted); font-size: 13px; }
	.head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
	.id { color: var(--muted); font-variant-numeric: tabular-nums; }
	.card .title { font-weight: 650; font-size: 20px; }
	.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
	.pill.open { color: var(--open); } .pill.answered { color: var(--answered); } .pill.resolved { color: var(--resolved); }
	.pill + .pill { margin-left: 4px; }
	.pill.yours { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
	.label { font-size: 12px; color: var(--muted); background: var(--code); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
	.meta { color: var(--muted); font-size: 13px; }
	.relation { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
	.relation a { color: var(--text); }
	.children { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
	.children ul { margin: 6px 0 0; padding-left: 18px; }
	.children li { margin: 2px 0; }
	.md { overflow-wrap: anywhere; }
	.md :first-child { margin-top: 0; } .md :last-child { margin-bottom: 0; }
	.md img, .md video { max-width: 100%; max-height: 360px; border-radius: 6px; }
	.md pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow: auto; }
	.md code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
	.md pre code { background: none; padding: 0; }
	.md table { border-collapse: collapse; } .md td, .md th { border: 1px solid var(--line); padding: 4px 8px; }
	.md blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
	.md .mermaid { background: #fff; border-radius: 6px; padding: 8px; overflow: auto; }
	.body { margin-top: 14px; }
	.answer { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line); }
	.who { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
	.actions { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
	.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
	textarea, input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
	textarea { min-height: 96px; resize: vertical; }
	textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
	.draft-note { font-size: 12px; color: var(--muted); }
	.composer { margin: 0 0 16px; }
	#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; white-space: pre-wrap; }
	#toast.show { opacity: 1; }
	#toast.error { background: var(--accent); color: var(--accent-text); }
	.offline { color: var(--accent); font-size: 13px; }
</style>
</head>
<body>
<header><div class="bar">
	<h1><a href="#/">Desk</a></h1><span class="root" id="root"></span>
	<span class="spacer"></span>
	<span class="offline" id="offline" hidden>reconnecting…</span>
	<select id="main" title="Main session: where answers are delivered"></select>
	<button class="secondary" id="ask">New question</button>
	<button class="primary" id="submit" title="Send every draft to the main session in one message, after its current turn">Submit</button>
</div></header>
<main>
	<div id="composer"></div>
	<div id="content"></div>
</main>
<div id="toast"></div>
<script type="module">
import { marked } from "https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.esm.js";
import DOMPurify from "https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.es.mjs";
import hljs from "https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/es/highlight.min.js";

let view = null;
/** Text typed but not yet echoed back by the server, so live updates never clobber typing. */
const local = new Map();
const following = new Set(); // entries whose follow-up composer the user opened
let composing = false; // the top-level "New question" composer
const saveTimers = new Map();
/**
 * The order Next walks: the list as it was when the user started working through it. Answering an entry moves it
 * down the live list; walking a snapshot keeps Next from skipping what was after it.
 */
let walk = [];
let mermaid = null;
const diagrams = new Map();

const $ = (id) => document.getElementById(id);
const esc = (text) => String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const byId = (id) => view.entries.find((entry) => entry.id === id);
const route = () => {
	const match = /^#\/(\d+)$/.exec(location.hash);
	return match ? Number(match[1]) : null;
};

function toast(message, error = false) {
	const node = $("toast");
	node.textContent = message;
	node.className = `show${error ? " error" : ""}`;
	clearTimeout(toast.timer);
	toast.timer = setTimeout(() => (node.className = ""), error ? 6000 : 2500);
}

async function post(path, body = {}) {
	const response = await fetch(path, { method: "POST", headers: { "content-type": "application/json", "x-desk": "1" }, body: JSON.stringify(body) });
	const result = await response.json().catch(() => ({ ok: false, error: response.statusText }));
	if (!result.ok) throw new Error(result.error);
	return result.value;
}

// ─── Markdown ────────────────────────────────────────────────────────────────

const videoExtension = /\.(mp4|webm|mov|m4v)(\?|#|$)/i;

/** Repo-relative paths (and file:// URLs inside the checkout) load through the desk's /files/ route. */
function asset(url) {
	if (!url || /^(https?:|data:|blob:|#|mailto:)/i.test(url)) return url;
	if (url.startsWith("file://")) {
		const path = decodeURIComponent(url.slice(7));
		return path.startsWith(view.root + "/") ? `/files/${path.slice(view.root.length + 1)}` : url;
	}
	if (url.startsWith(view.root + "/")) return `/files/${url.slice(view.root.length + 1)}`;
	return `/files/${url.replace(/^\.?\//, "")}`;
}

function markdown(text) {
	const html = DOMPurify.sanitize(marked.parse(text || "", { gfm: true }), { ADD_TAGS: ["video"], ADD_ATTR: ["controls", "loop", "muted", "playsinline"] });
	const template = document.createElement("template");
	template.innerHTML = html;
	for (const img of template.content.querySelectorAll("img")) {
		const src = asset(img.getAttribute("src"));
		if (videoExtension.test(src)) {
			const video = document.createElement("video");
			Object.assign(video, { src, controls: true, loop: true, muted: true, playsInline: true, title: img.alt });
			img.replaceWith(video);
		} else img.setAttribute("src", src);
	}
	for (const link of template.content.querySelectorAll("a[href]")) {
		const href = link.getAttribute("href");
		if (!/^(https?:|mailto:|#)/i.test(href)) link.setAttribute("href", asset(href));
		if (!href.startsWith("#")) {
			link.target = "_blank";
			link.rel = "noreferrer";
		}
	}
	for (const code of template.content.querySelectorAll("pre > code")) {
		if (code.classList.contains("language-mermaid")) {
			const div = document.createElement("div");
			div.className = "mermaid";
			div.dataset.source = code.textContent;
			code.parentElement.replaceWith(div);
		} else hljs.highlightElement(code);
	}
	return template.innerHTML;
}

async function renderDiagrams() {
	const nodes = [...document.querySelectorAll(".mermaid[data-source]")];
	if (nodes.length === 0) return;
	mermaid ??= (await import("https://cdn.jsdelivr.net/npm/mermaid@11.6.0/dist/mermaid.esm.min.mjs")).default;
	mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict" });
	for (const node of nodes) {
		const source = node.dataset.source;
		delete node.dataset.source;
		try {
			if (!diagrams.has(source)) diagrams.set(source, (await mermaid.render(`m${diagrams.size}`, source)).svg);
			node.innerHTML = diagrams.get(source);
		} catch (error) {
			node.innerHTML = `<pre>${esc(source)}</pre><div class="draft-note">Mermaid: ${esc(error.message)}</div>`;
		}
	}
}

// ─── Rendering ───────────────────────────────────────────────────────────────

const keyOfAnswer = (id) => `answer-${id}`;
const keyOfAsk = (parent) => `ask-${parent ?? "top"}`;
const yourTurn = (entry) => (entry.status === "open" && entry.answerer === "user") || (entry.status === "answered" && entry.asker === "user");

function draftText(key, field = "text") {
	const pending = local.get(key);
	if (pending) return pending[field] ?? "";
	return view.drafts[key]?.[field] ?? "";
}

function draftCount() {
	const keys = new Set(Object.keys(view.drafts));
	for (const [key, draft] of local) {
		if ((draft.text || draft.title || "").trim()) keys.add(key);
		else keys.delete(key);
	}
	return keys.size;
}

function relative(iso) {
	const seconds = (Date.now() - Date.parse(iso)) / 1000;
	if (!isFinite(seconds)) return "";
	if (seconds < 90) return "just now";
	if (seconds < 5400) return `${Math.round(seconds / 60)} min ago`;
	if (seconds < 129600) return `${Math.round(seconds / 3600)} h ago`;
	return new Date(iso).toLocaleDateString();
}

function pills(entry) {
	return `<span class="pill ${entry.status}">${entry.status}</span>${yourTurn(entry) ? `<span class="pill yours">your turn</span>` : ""}`;
}

function askComposer(parent) {
	const key = keyOfAsk(parent);
	return `<div class="actions">
		<input type="text" data-draft="${key}" data-field="title" placeholder="${parent === null ? "Your question for the agents" : "Follow-up question"}" value="${esc(draftText(key, "title"))}">
		<textarea data-draft="${key}" data-field="text" placeholder="Details (Markdown)">${esc(draftText(key))}</textarea>
		<div class="row"><button class="secondary" data-send="${key}" title="Deliver now, steering the main session's current turn">Send now</button>
		<span class="draft-note">Saved as a draft; Submit sends all drafts together.</span></div>
	</div>`;
}

function listView() {
	const item = (entry) => `<a class="item${yourTurn(entry) ? " turn" : ""}" href="#/${entry.id}">
		<span class="id">#${entry.id}</span><span class="title">${esc(entry.title)}</span>${pills(entry)}</a>`;
	const entries = view.queue.map(byId);
	const mine = entries.filter(yourTurn);
	const theirs = entries.filter((entry) => !yourTurn(entry));
	if (entries.length === 0) return `<div class="empty">Nothing is open.</div>`;
	return [
		mine.length ? `<div class="section">Waiting on you</div><div class="list">${mine.map(item).join("")}</div>` : "",
		theirs.length ? `<div class="section">Waiting on the agents</div><div class="list">${theirs.map(item).join("")}</div>` : "",
	].join("");
}

/** The next entry after `id` in the walk that is still open; the walk restarts from the live list when `id` isn't in it. */
function nextAfter(id) {
	if (!walk.includes(id)) walk = [...view.queue];
	const start = walk.indexOf(id);
	return walk.slice(start + 1).find((other) => view.queue.includes(other)) ?? null;
}

/** Back to the list, where this entry sits in it, and Next. */
function nav(id) {
	const next = nextAfter(id);
	const position = view.queue.indexOf(id);
	return `<div class="nav">
			<a href="#/">← All entries</a><span class="spacer"></span>
			${position >= 0 ? `<span class="position">${position + 1} of ${view.queue.length}</span>` : ""}
			<button class="primary" id="next" ${next === null ? "disabled title=\"No more open entries\"" : `data-next="${next}"`}>Next →</button>
		</div>`;
}

function entryView(id) {
	const entry = byId(id);
	if (!entry) return `${nav(id)}<div class="empty">#${id} is no longer on the desk: it was resolved and removed.</div>`;
	const parent = entry.parent === null ? null : byId(entry.parent);
	const children = view.entries.filter((other) => other.parent === entry.id);
	const actions = [];
	if (entry.answerer === "user" && entry.status !== "resolved") {
		const key = keyOfAnswer(entry.id);
		actions.push(`<textarea data-draft="${key}" data-field="text" placeholder="${entry.status === "answered" ? "Change your answer (Markdown)" : "Your answer (Markdown)"}">${esc(draftText(key))}</textarea>
			<div class="row"><button class="secondary" data-send="${key}" title="Deliver now, steering the main session's current turn">Send now</button>
			<span class="draft-note">Saved as a draft; Submit sends all drafts together.</span></div>`);
	}
	const buttons = [];
	if (entry.asker === "user" && entry.status !== "resolved") buttons.push(`<button class="secondary" data-resolve="${entry.id}">Mark done</button>`);
	if (entry.status !== "resolved" && !following.has(entry.id) && !draftText(keyOfAsk(entry.id)) && !draftText(keyOfAsk(entry.id), "title")) {
		buttons.push(`<button class="link" data-follow="${entry.id}">Follow up</button>`);
	}
	if (buttons.length) actions.push(`<div class="row">${buttons.join("")}</div>`);
	if (following.has(entry.id) || draftText(keyOfAsk(entry.id)) || draftText(keyOfAsk(entry.id), "title")) actions.push(askComposer(entry.id));
	return `${nav(entry.id)}
		<div class="card${yourTurn(entry) ? " turn" : ""}">
			<div class="head">
				<span class="id">#${entry.id}</span><span class="title">${esc(entry.title)}</span>${pills(entry)}
				${entry.labels.map((label) => `<span class="label">${esc(label)}</span>`).join("")}
			</div>
			<div class="meta">${entry.asker === "main" ? "agents → you" : "you → agents"} · ${relative(entry.created)}</div>
			${entry.parent !== null ? `<div class="relation">Follow-up to ${parent ? `<a href="#/${parent.id}">#${parent.id} ${esc(parent.title)}</a> ${pills(parent)}` : `#${entry.parent} (removed)`}</div>` : ""}
			<div class="body md">${entry.question ? markdown(entry.question) : `<p class="draft-note">(no details)</p>`}</div>
			${entry.answer !== null ? `<div class="answer"><div class="who">Answer from ${entry.answerer === "user" ? "you" : "the agents"}</div><div class="md">${markdown(entry.answer)}</div></div>` : ""}
			${actions.length ? `<div class="actions">${actions.join("")}</div>` : ""}
			${children.length ? `<div class="children"><div class="who">Follow-ups</div><ul>${children.map((child) => `<li><a href="#/${child.id}">#${child.id} ${esc(child.title)}</a> ${pills(child)}</li>`).join("")}</ul></div>` : ""}
		</div>`;
}

let shown = null;
function render() {
	if (!view) return;
	// Keep focus and caret across the re-render.
	const focused = document.activeElement;
	const focus = focused?.dataset?.draft ? { key: focused.dataset.draft, field: focused.dataset.field, start: focused.selectionStart, end: focused.selectionEnd } : null;

	$("root").textContent = view.root.split("/").pop();
	$("root").title = view.root;
	document.title = view.waiting ? `(${view.waiting}) Desk` : "Desk";
	const count = draftCount();
	$("submit").textContent = count ? `Submit ${count} draft${count === 1 ? "" : "s"}` : "Submit";
	$("submit").disabled = count === 0;
	$("composer").innerHTML = composing || draftText(keyOfAsk(null)) || draftText(keyOfAsk(null), "title") ? `<div class="card composer"><div class="who">New question for the agents</div>${askComposer(null)}</div>` : "";
	const id = route();
	$("content").innerHTML = id === null ? listView() : entryView(id);
	if (shown !== location.hash) {
		shown = location.hash;
		window.scrollTo(0, 0);
	}
	renderDiagrams();

	if (focus) {
		const node = document.querySelector(`[data-draft="${focus.key}"][data-field="${focus.field}"]`);
		if (node) {
			node.focus();
			node.setSelectionRange?.(focus.start, focus.end);
		}
	}
}

async function renderSessions() {
	const select = $("main");
	const result = await fetch("/api/sessions").then((r) => r.json()).catch(() => ({ ok: false }));
	const sessions = result.ok ? result.value : [];
	const current = view?.main;
	const options = current && !sessions.some((s) => s.id === current.id) ? [current, ...sessions] : sessions;
	select.innerHTML = (current ? "" : `<option value="">Main: first session to use a desk tool</option>`) +
		options.map((s) => `<option value="${esc(s.id)}"${s.id === current?.id ? " selected" : ""}>Main: ${esc(s.title)}</option>`).join("");
}

// ─── Events ──────────────────────────────────────────────────────────────────

function saveDraft(key) {
	clearTimeout(saveTimers.get(key));
	saveTimers.set(key, setTimeout(() => flushDraft(key), 400));
}

async function flushDraft(key) {
	clearTimeout(saveTimers.get(key));
	saveTimers.delete(key);
	const pending = local.get(key);
	if (!pending) return;
	const draft = key.startsWith("answer-")
		? { kind: "answer", entry: Number(key.slice(7)), text: pending.text ?? "" }
		: { kind: "ask", parent: key === "ask-top" ? null : Number(key.slice(4)), title: pending.title ?? "", text: pending.text ?? "" };
	try {
		await post("/api/draft", draft);
	} catch (error) {
		toast(`Draft not saved: ${error.message}`, true);
	}
}

const flushAll = () => Promise.all([...saveTimers.keys()].map(flushDraft));

document.addEventListener("input", (event) => {
	const { draft: key, field } = event.target.dataset;
	if (!key) return;
	const pending = local.get(key) ?? { title: draftText(key, "title"), text: draftText(key) };
	pending[field] = event.target.value;
	local.set(key, pending);
	saveDraft(key);
	const count = draftCount();
	$("submit").textContent = count ? `Submit ${count} draft${count === 1 ? "" : "s"}` : "Submit";
	$("submit").disabled = count === 0;
});

document.addEventListener("click", async (event) => {
	const target = event.target.closest("button");
	if (!target) return;
	const data = target.dataset;
	try {
		if (data.next) {
			await flushAll();
			location.hash = `#/${data.next}`;
		} else if (data.follow) {
			following.add(Number(data.follow));
			render();
			document.querySelector(`[data-draft="${keyOfAsk(Number(data.follow))}"][data-field="title"]`)?.focus();
		} else if (data.resolve) {
			await post("/api/resolve", { id: Number(data.resolve) });
			toast(`#${data.resolve} marked done`);
		} else if (data.send) {
			await flushAll();
			await post("/api/send", { key: data.send });
			local.delete(data.send);
			toast("Sent to the main session");
		} else if (target.id === "submit") {
			await flushAll();
			const count = await post("/api/submit");
			local.clear();
			following.clear();
			composing = false;
			toast(`Submitted ${count} draft${count === 1 ? "" : "s"}; queued for the main session`);
		} else if (target.id === "ask") {
			composing = true;
			render();
			document.querySelector(`[data-draft="ask-top"][data-field="title"]`)?.focus();
		}
	} catch (error) {
		toast(error.message, true);
	}
});

// Opening an entry from the list starts a new walk in the list's current order.
document.addEventListener("click", (event) => {
	if (event.target.closest(".list a")) walk = [...view.queue];
});

window.addEventListener("hashchange", () => {
	flushAll();
	render();
});

$("main").addEventListener("change", async (event) => {
	if (!event.target.value) return;
	try {
		await post("/api/main", { sessionID: event.target.value });
		toast("Main session changed");
	} catch (error) {
		toast(error.message, true);
	}
});
$("main").addEventListener("focus", renderSessions);

function connect() {
	const source = new EventSource("/api/events");
	source.addEventListener("view", (event) => {
		const previousMain = view?.main?.id;
		view = JSON.parse(event.data);
		// The server caught up with the typing: stop overriding it.
		for (const [key, pending] of local) {
			const saved = view.drafts[key];
			const empty = !(pending.text || "").trim() && !(pending.title || "").trim();
			const same = saved && saved.text === (pending.text ?? "") && (saved.title ?? "") === (pending.title ?? "");
			if (!saveTimers.has(key) && (same || (!saved && empty))) local.delete(key);
		}
		$("offline").hidden = true;
		render();
		if (previousMain !== view.main?.id || !$("main").options.length) renderSessions();
	});
	source.onerror = () => ($("offline").hidden = false);
}
connect();
</script>
</body>
</html>
