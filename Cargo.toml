[workspace]
resolver = "3"
members = ["proto", "lifecycle", "client", "service", "cli", "gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
proto = { path = "proto" }
lifecycle = { path = "lifecycle" }
client = { path = "client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# No debug info for dependencies: it was most of `target/`, and we don't step into them. Our own
# crates keep it. To debug into a dependency, build with
# `--config 'profile.dev.package."*".debug=true'`.
[profile.dev.package."*"]
debug = false
