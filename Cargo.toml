[workspace]
resolver = "3"
members = ["proto", "machine", "lifecycle", "client", "service", "cli", "gui", "cases"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
proto = { path = "proto" }
machine = { path = "machine" }
lifecycle = { path = "lifecycle" }
client = { path = "client" }
cases = { path = "cases" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Rune builds against its own patched copies of these; Cargo doesn't inherit a dependency's `[patch]`,
# so they're here, at Rune's rev in gui/Cargo.toml (bump both together).
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "2f15e4a906489e6d6c84498fd1c01d819132466e" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "2f15e4a906489e6d6c84498fd1c01d819132466e" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "2f15e4a906489e6d6c84498fd1c01d819132466e" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "2f15e4a906489e6d6c84498fd1c01d819132466e" }
naga = { git = "https://github.com/anomalyco/rune", rev = "2f15e4a906489e6d6c84498fd1c01d819132466e" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "2f15e4a906489e6d6c84498fd1c01d819132466e" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "2f15e4a906489e6d6c84498fd1c01d819132466e" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "2f15e4a906489e6d6c84498fd1c01d819132466e" }

# No debug info for dependencies: it was most of `target/`, and we don't step into them. Our own
# crates keep it. To debug into a dependency, build with
# `--config 'profile.dev.package."*".debug=true'`.
[profile.dev.package."*"]
debug = false

# The GUI tests spend their time in Rune, 5× faster optimized (#194). Rune's crates alone aren't
# enough: its generic runtime, `Runtime<Phantom>`, is compiled in `gui`. Tests only; debug
# assertions and overflow checks stay on.
[profile.test.package.gui]
opt-level = 1

[profile.test.package.rune]
opt-level = 2

[profile.test.package.rune-motion]
opt-level = 2

[profile.test.package.rune-kit]
opt-level = 2

[profile.test.package.rune-taffy]
opt-level = 2

[profile.test.package.rune-staging]
opt-level = 2

[profile.test.package.rune-core]
opt-level = 2

[profile.test.package.rune-edit]
opt-level = 2

[profile.test.package.rune-gpu]
opt-level = 2

[profile.test.package.rune-image]
opt-level = 2

[profile.test.package.rune-media]
opt-level = 2

[profile.test.package.rune-text]
opt-level = 2
